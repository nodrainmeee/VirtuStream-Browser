name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - uses: microsoft/setup-msbuild@v2

      - name: Softcam x64 / x86
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/tshino/softcam.git
          $proj = Get-ChildItem softcam -Recurse -Filter softcam.vcxproj | Select-Object -First 1
          if (-not $proj) {
            Write-Host "=== Fichiers .vcxproj / .sln trouvés ==="
            Get-ChildItem softcam -Recurse -Include *.vcxproj,*.sln | ForEach-Object { $_.FullName }
            throw "softcam.vcxproj introuvable : copiez-moi la liste ci-dessus."
          }
          Write-Host "Projet : $($proj.FullName)"
          foreach ($p in @('x64','Win32')) {
            msbuild $proj.FullName /p:Configuration=Release /p:Platform=$p /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "msbuild a échoué ($p)" }
            $d = if ($p -eq 'x64') {'x64'} else {'x86'}
            New-Item -ItemType Directory -Force dist/softcam/$d | Out-Null
            $dll = Get-ChildItem softcam -Recurse -Filter softcam.dll |
                   Where-Object { $_.FullName -match $p -or ($p -eq 'Win32' -and $_.FullName -notmatch 'x64') } |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $dll) {
              Get-ChildItem softcam -Recurse -Include *.dll | ForEach-Object { $_.FullName }
              throw "softcam.dll introuvable apres compilation ($p)"
            }
            Write-Host "DLL $p : $($dll.FullName)"
            Copy-Item $dll.FullName dist/softcam/$d/softcam.dll
          }

      - name: FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip ffx
          New-Item -ItemType Directory -Force dist/app/tools | Out-Null
          Get-ChildItem ffx -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination dist/app/tools/

      - name: NSIS
        run: choco install nsis -y

      - name: Compilation de l'application
        run: dotnet publish src/VirtuStream.App/VirtuStream.App.csproj -c Release -o dist/app

      - name: Installateur
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer\VirtuStream.nsi'

      - uses: actions/upload-artifact@v4
        with:
          name: VirtuStream-Setup
          path: dist/VirtuStream-Setup.exe
